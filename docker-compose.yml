# Production stack: the Go app only. nginx + certbot run on the host and
# terminate TLS; see deploy/nginx.conf.example and deploy/DEPLOY.md.
#
# Named volumes, not bind mounts. This is the whole reason there's no chown
# step: Docker seeds a named volume with the ownership baked into the image
# (uid 10001), whereas a bind mount keeps the host directory's ownership —
# which is root by default, and is what produced the "unable to open database
# file: out of memory" startup failure.
#
# Deploy:
#   cp .env.example .env    # fill in real values
#   docker compose up -d --build
#
# That's it — no directories to create, no permissions to fix.

services:
  app:
    build: .
    image: prebuilt-sheds:latest
    container_name: prebuilt-sheds
    restart: unless-stopped

    env_file: .env
    environment:
      PORT: 8080
      DB_PATH: /data/prebuilt.db
      # Required behind nginx: without it the per-IP rate limiter sees only
      # nginx's address and throttles every visitor as one client.
      TRUST_PROXY: "true"
      # Marks the admin CSRF cookie Secure. Correct once certbot has run — but
      # if you bring the site up on plain HTTP first, the browser will drop
      # that cookie and admin form posts will fail until TLS is in place.
      COOKIE_SECURE: "true"

    volumes:
      - prebuilt-data:/data
      - prebuilt-uploads:/app/public/images/inventory

    # Bound to 127.0.0.1, not 0.0.0.0. Docker writes its own iptables rules
    # that bypass ufw, so a plain "8080:8080" would publish the app straight to
    # the internet — unencrypted, bypassing nginx — even with the firewall up.
    ports:
      - "127.0.0.1:8080:8080"

    logging:
      # Unbounded logs fill a small VPS's disk, which also stops SQLite writes.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  prebuilt-data:
  prebuilt-uploads:
