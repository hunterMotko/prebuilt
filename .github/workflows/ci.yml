name: CI

# Every job body is a `make` target. The pipeline deliberately holds no
# commands of its own: when CI and the developer run different things they
# drift, and "passes locally, red in CI" becomes routine. `make ci` reproduces
# this entire file on a laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the first. Nothing here is worth
# paying for twice, and the older run's result is already stale.
#
# Except on main, where the run also publishes an image. Cancelling mid-push
# cannot corrupt a tag — the manifest is written last, so a half-uploaded image
# is invisible — but it can leave `latest` pointing at the older commit while
# the newer one reports success, which is a confusing state to debug.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, vet, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile decides which Go builds this project, so CI installs
      # that one. Parsing it needs no toolchain, which is why this can run
      # before setup-go.
      #
      # NOT `go-version-file: go.mod`. That was the original approach and it
      # was wrong: the `go` directive is a minimum language version, and
      # setup-go treats it as an exact pin, so `go 1.25.0` installed Go 1.25.0
      # and the vulnerability scan reported 26 standard-library findings that
      # were all already fixed in later 1.25.x patches. The shipped image,
      # built on golang:1.26-alpine, never had any of them.
      - id: go
        run: echo "version=$(make print-go-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Resolve to the newest patch of that minor, mirroring how the
          # golang:<minor>-alpine tag resolves. Without this a cached toolchain
          # can pin an early patch and reintroduce exactly the problem above.
          check-latest: true
          cache: true

      # setup-go v6 began setting GOTOOLCHAIN=local, which suits this repo:
      # the version installed above is now the version that actually runs,
      # instead of go silently downloading whatever the go directive asks for.
      # A Dockerfile older than go.mod fails here loudly rather than passing CI
      # on a downloaded toolchain and breaking the deploy — the same failure
      # `make check-docker-go` exists to catch, now caught twice.
      - run: go version && go env GOTOOLCHAIN

      - run: make fmt-check
      - run: make vet
      - run: make test

      # Guards the exact bug this project shipped once: `go get` raised the go
      # directive and the Dockerfile was still on the old builder image.
      # Invisible locally, broken on deploy.
      - run: make check-docker-go

      # 43 end-to-end checks against a real running binary — routing, auth,
      # CSRF via both token sources, security headers, body limits, rate
      # limiting, spam defences. Runs against a throwaway database with SMTP
      # forced empty.
      - run: make smoke

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Deliberately its own job. A newly published upstream CVE turns this red
    # without a single line of this repo changing, and that needs to be
    # distinguishable at a glance from "my code broke" — same reason it should
    # never be folded into the check job.
    steps:
      - uses: actions/checkout@v7
      - id: go
        run: echo "version=$(make print-go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache: true
      - run: make vuln

  docker:
    name: Image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the image, runs it, and asserts it actually serves. A Go build
      # cannot catch the failure this targets: templates and static assets are
      # resolved by relative path at runtime, so a missing COPY produces an
      # image that builds cleanly and panics on startup. This project reasoned
      # about the Dockerfile for an entire development cycle without ever
      # building it — this job is what stops that recurring.
      - run: make docker-smoke

  publish:
    name: Publish image to GHCR
    # The whole reason this lives in ci.yml instead of its own cd.yml: `needs`
    # is enforced by the job graph, so an image physically cannot reach the
    # registry unless the tests, the vulnerability scan, and the container
    # smoke test all went green. A separate workflow would have to chain off
    # `workflow_run`, which fires regardless of conclusion and has to be
    # re-checked by hand.
    needs: [check, vuln, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Narrower than a file-level grant: this is the only job that may write to
    # the registry, so a compromised action in any other job cannot publish.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN, not a PAT. It is minted per-run, expires with the run,
      # and is already scoped by the `permissions` block above — there is no
      # long-lived secret to rotate or leak.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Two tags on every push, and the sha- one is the important half:
      # `latest` is a moving target, so it cannot be rolled back to. sha-<short>
      # is immutable and is what a rollback pins to.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # linux/amd64 only. Adding linux/arm64 roughly doubles the job's runtime
      # because modernc.org/sqlite is an 8.6 MB generated source file that has
      # to be compiled once per architecture. Check the VPS with `uname -m`
      # before assuming: aarch64 needs arm64 added here, or the pulled image
      # will fail to start with an exec format error.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persists the Go build cache between runs, so a typical push
          # recompiles only the packages that changed rather than all of
          # modernc.org/sqlite.
          cache-from: type=gha
          cache-to: type=gha,mode=max
