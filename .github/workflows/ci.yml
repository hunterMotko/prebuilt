name: CI

# Every job body is a `make` target. The pipeline deliberately holds no
# commands of its own: when CI and the developer run different things they
# drift, and "passes locally, red in CI" becomes routine. `make ci` reproduces
# this entire file on a laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the first — except on main, where the
# run also publishes. Cancelling can't corrupt a tag (the manifest is written
# last) but it can leave `latest` on the older commit while the newer one reports
# success, which is a confusing state to debug.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, vet, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile decides which Go builds this project, so CI installs that
      # one. Parsing it needs no toolchain, hence before setup-go.
      #
      # NOT `go-version-file: go.mod`. setup-go treats the `go` directive as an
      # exact pin rather than the minimum it is, so `go 1.25.0` installed 1.25.0
      # and govulncheck reported 26 stdlib findings already fixed in later
      # patches. The shipped image, on golang:1.26-alpine, had none of them.
      - id: go
        run: echo "version=$(make print-go-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Newest patch of that minor, mirroring how golang:<minor>-alpine
          # resolves. Without it a cached toolchain reintroduces the above.
          check-latest: true
          cache: true

      # setup-go v6+ sets GOTOOLCHAIN=local, so the version installed above is
      # the one that runs instead of go downloading whatever go.mod asks for.
      # A Dockerfile older than go.mod now fails here loudly.
      - run: go version && go env GOTOOLCHAIN

      - run: make fmt-check
      - run: make vet
      - run: make test

      # Guards a bug this project shipped: `go get` raised the go directive while
      # the Dockerfile stayed on the old builder image. Invisible locally.
      - run: make check-docker-go

      # 50 end-to-end checks against a real running binary — routing, auth, CSRF
      # via both token sources, security headers, body limits, rate limiting,
      # spam defences. Throwaway database, SMTP forced empty.
      - run: make smoke

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Its own job: a newly published upstream CVE turns this red without a line
    # of this repo changing, and that must be distinguishable at a glance from
    # "my code broke".
    steps:
      - uses: actions/checkout@v7
      - id: go
        run: echo "version=$(make print-go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache: true
      - run: make vuln

  docker:
    name: Image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Builds the image, runs it, asserts it serves. A Go build can't catch what
      # this targets: templates and static assets resolve by relative path at
      # runtime, so a missing COPY builds cleanly and panics on startup.
      - run: make docker-smoke

  publish:
    name: Publish image to GHCR
    # Why this lives in ci.yml and not its own cd.yml: `needs` is enforced by the
    # job graph, so an image physically cannot reach the registry unless all
    # three went green. A separate workflow would chain off `workflow_run`, which
    # fires regardless of conclusion.
    needs: [check, vuln, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Narrower than a file-level grant: the only job that may write to the
    # registry, so a compromised action elsewhere cannot publish.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN, not a PAT: minted per-run, expires with it, scoped by the
      # permissions block above. No long-lived secret to rotate or leak.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The sha- tag is the important half: `latest` is a moving target and can't
      # be rolled back to. sha-<short> is immutable and is what a rollback pins.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # amd64 only. arm64 roughly doubles runtime — modernc.org/sqlite is an
      # 8.6 MB generated source file compiled once per architecture. Check the VPS
      # with `uname -m`: aarch64 needs arm64 added here or the pulled image fails
      # to start with an exec format error.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Persists the Go build cache between runs, so a typical push recompiles
          # only what changed rather than all of modernc.org/sqlite.
          cache-from: type=gha
          cache-to: type=gha,mode=max
