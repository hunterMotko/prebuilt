name: CI

# Every job body is a `make` target. The pipeline deliberately holds no
# commands of its own: when CI and the developer run different things they
# drift, and "passes locally, red in CI" becomes routine. `make ci` reproduces
# this entire file on a laptop.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the first. Nothing here is worth
# paying for twice, and the older run's result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, vet, test, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile decides which Go builds this project, so CI installs
      # that one. Parsing it needs no toolchain, which is why this can run
      # before setup-go.
      #
      # NOT `go-version-file: go.mod`. That was the original approach and it
      # was wrong: the `go` directive is a minimum language version, and
      # setup-go treats it as an exact pin, so `go 1.25.0` installed Go 1.25.0
      # and the vulnerability scan reported 26 standard-library findings that
      # were all already fixed in later 1.25.x patches. The shipped image,
      # built on golang:1.26-alpine, never had any of them.
      - id: go
        run: echo "version=$(make print-go-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          # Resolve to the newest patch of that minor, mirroring how the
          # golang:<minor>-alpine tag resolves. Without this a cached toolchain
          # can pin an early patch and reintroduce exactly the problem above.
          check-latest: true
          cache: true

      - run: make fmt-check
      - run: make vet
      - run: make test

      # Guards the exact bug this project shipped once: `go get` raised the go
      # directive and the Dockerfile was still on the old builder image.
      # Invisible locally, broken on deploy.
      - run: make check-docker-go

      # 43 end-to-end checks against a real running binary — routing, auth,
      # CSRF via both token sources, security headers, body limits, rate
      # limiting, spam defences. Runs against a throwaway database with SMTP
      # forced empty.
      - run: make smoke

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    # Deliberately its own job. A newly published upstream CVE turns this red
    # without a single line of this repo changing, and that needs to be
    # distinguishable at a glance from "my code broke" — same reason it should
    # never be folded into the check job.
    steps:
      - uses: actions/checkout@v4
      - id: go
        run: echo "version=$(make print-go-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: true
          cache: true
      - run: make vuln

  docker:
    name: Image builds and runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the image, runs it, and asserts it actually serves. A Go build
      # cannot catch the failure this targets: templates and static assets are
      # resolved by relative path at runtime, so a missing COPY produces an
      # image that builds cleanly and panics on startup. This project reasoned
      # about the Dockerfile for an entire development cycle without ever
      # building it — this job is what stops that recurring.
      - run: make docker-smoke
