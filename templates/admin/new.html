{{define "admin_new.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" type="image/png" href="/public/images/pbs-logo.png">
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body class="admin-body">

<div class="container admin-shell">
    <div class="admin-header">
        <h1 class="section-title">New <span class="red-text">Inventory Item</span></h1>
        <a href="{{adminPath}}" class="btn btn-outline btn-sm">&larr; Back to list</a>
    </div>

    <form method="POST" action="{{adminPath}}/inventory" class="admin-form" enctype="multipart/form-data">
        <input type="hidden" name="csrf" value="{{.CSRFToken}}">
        <div class="form-row">
            <div class="form-group">
                <label for="lot">Lot <span class="req">*</span></label>
                <select id="lot" name="lot" required>
                    <option value="1">Lot 1</option>
                    <option value="2">Lot 2</option>
                    <option value="3">Lot 3</option>
                </select>
            </div>
            <div class="form-group">
                <label for="style">Style <span class="req">*</span></label>
                <select id="style" name="style" required>
                    <option value="Barn">Barn (Gambrel)</option>
                    <option value="Gable">Gable</option>
                    <option value="Skillion">Skillion</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="width">Width (ft) <span class="req">*</span></label>
                <input type="number" id="width" name="width" min="1" required>
            </div>
            <div class="form-group">
                <label for="length">Length (ft) <span class="req">*</span></label>
                <input type="number" id="length" name="length" min="1" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="siding_code">Siding Color <span class="req">*</span></label>
                <select id="siding_code" name="siding_code" required>
                    {{range .SidingColors}}<option value="{{.Code}}">{{.Code}} &mdash; {{.Name}}</option>{{end}}
                </select>
                <div class="color-legend">
                    {{range .SidingColors}}<span class="color-swatch" style="background:{{.Hex}}" title="{{.Code}} — {{.Name}}"></span>{{end}}
                </div>
            </div>
            <div class="form-group">
                <label for="roof_code">Roof Color <span class="req">*</span></label>
                <select id="roof_code" name="roof_code" required>
                    {{range .RoofColors}}<option value="{{.Code}}">{{.Code}} &mdash; {{.Name}}</option>{{end}}
                </select>
                <div class="color-legend">
                    {{range .RoofColors}}<span class="color-swatch" style="background:{{.Hex}}" title="{{.Code}} — {{.Name}}"></span>{{end}}
                </div>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Price (USD, optional)</label>
                <input type="number" id="price" name="price" min="0" step="0.01" placeholder="4999.00">
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="4" maxlength="2000"></textarea>
        </div>

        <div class="form-group">
            <label>Photos (optional, up to 12 total, jpg/png/webp, 8MB each)</label>
            <div class="photo-upload-row">
                <div class="form-group">
                    <label for="exterior_photos">Exterior</label>
                    <input type="file" id="exterior_photos" name="exterior_photos" accept="image/jpeg,image/png,image/webp" multiple>
                </div>
                <div class="form-group">
                    <label for="interior_photos">Interior</label>
                    <input type="file" id="interior_photos" name="interior_photos" accept="image/jpeg,image/png,image/webp" multiple>
                </div>
                <div class="form-group">
                    <label for="feature_photos">Feature</label>
                    <input type="file" id="feature_photos" name="feature_photos" accept="image/jpeg,image/png,image/webp" multiple>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Add to Inventory</button>
    </form>
</div>

</body>
</html>
{{end}}
