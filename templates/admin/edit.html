{{define "admin_edit.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" type="image/png" href="/public/images/pbs-logo.png">
    <link rel="stylesheet" href="/public/css/style.css">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <!-- htmx otherwise injects an inline <style> for .htmx-indicator, which
         style-src 'self' blocks; the spinner rules live in style.css instead. -->
    <meta name="htmx-config" content='{"includeIndicatorStyles":false}'>
    <script src="/public/js/htmx.min.js" defer></script>
    <script src="/public/js/admin.js" defer></script>
</head>
<body class="admin-body">

<div class="container admin-shell">
    <div class="admin-header">
        <h1 class="section-title">Edit <span class="red-text">Inventory Item</span></h1>
        <a href="{{adminPath}}" class="btn btn-outline btn-sm">&larr; Back to list</a>
    </div>

    <div class="admin-photos">
        <h3>Current Photos</h3>
        {{if .Item.Images}}
        <div class="admin-photo-grid">
            {{range .Item.Images}}{{template "admin_photo_thumb.html" .}}{{end}}
        </div>
        {{else}}
        <p class="admin-empty-inline">No photos yet.</p>
        {{end}}
    </div>

    <form method="POST" action="{{adminPath}}/inventory/{{.Item.ID}}" class="admin-form" enctype="multipart/form-data">
        <input type="hidden" name="csrf" value="{{.CSRFToken}}">
        <div class="form-row">
            <div class="form-group">
                <label for="lot">Lot <span class="req">*</span></label>
                <select id="lot" name="lot" required>
                    <option value="1" {{if eq .Item.Lot 1}}selected{{end}}>Lot 1</option>
                    <option value="2" {{if eq .Item.Lot 2}}selected{{end}}>Lot 2</option>
                    <option value="3" {{if eq .Item.Lot 3}}selected{{end}}>Lot 3</option>
                </select>
            </div>

            <div class="form-group">
                <label for="style">Style <span class="req">*</span></label>
                <select id="style" name="style" required>
                    <option value="Barn" {{if eq .Item.Style "Barn"}}selected{{end}}>Barn (Gambrel)</option>
                    <option value="Gable" {{if eq .Item.Style "Gable"}}selected{{end}}>Gable</option>
                    <option value="Skillion" {{if eq .Item.Style "Skillion"}}selected{{end}}>Skillion</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="width">Width (ft) <span class="req">*</span></label>
                <input type="number" id="width" name="width" min="1" value="{{.Item.Width}}" required>
            </div>
            <div class="form-group">
                <label for="length">Length (ft) <span class="req">*</span></label>
                <input type="number" id="length" name="length" min="1" value="{{.Item.Length}}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="siding_code">Siding Color Code <span class="req">*</span></label>
                <input type="text" id="siding_code" name="siding_code" maxlength="20" value="{{.Item.SidingCode}}" required>
            </div>
            <div class="form-group">
                <label for="roof_code">Roof Color Code <span class="req">*</span></label>
                <input type="text" id="roof_code" name="roof_code" maxlength="20" value="{{.Item.RoofCode}}" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="price">Price (USD, optional)</label>
                <input type="number" id="price" name="price" min="0" step="0.01" value="{{.PriceDollars}}" placeholder="4999.00">
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="4" maxlength="2000">{{.Item.Notes}}</textarea>
        </div>

        <div class="form-group">
            <label>Add More Photos (optional, up to 12 total, jpg/png/webp, 8MB each)</label>
            <div class="photo-upload-row">
                <div class="form-group">
                    <label for="exterior_photos">Exterior</label>
                    <input type="file" id="exterior_photos" name="exterior_photos" accept="image/jpeg,image/png,image/webp" multiple>
                </div>
                <div class="form-group">
                    <label for="interior_photos">Interior</label>
                    <input type="file" id="interior_photos" name="interior_photos" accept="image/jpeg,image/png,image/webp" multiple>
                </div>
                <div class="form-group">
                    <label for="feature_photos">Feature</label>
                    <input type="file" id="feature_photos" name="feature_photos" accept="image/jpeg,image/png,image/webp" multiple>
                </div>
            </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Save Changes</button>
    </form>
</div>

</body>
</html>
{{end}}
